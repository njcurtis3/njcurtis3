<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 270" font-family="'Courier New',Courier,monospace">
  <defs>
    <pattern id="dg2" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#a7abc0" opacity="0.7"/>
    </pattern>
    <pattern id="bc" width="7" height="16" patternUnits="userSpaceOnUse">
      <rect width="2" height="16" fill="#a7abc0" opacity="0.6"/>
      <rect x="3" width="1" height="16" fill="#a7abc0" opacity="0.4"/>
    </pattern>
  </defs>
  <style>
    .t  { fill:#a7abc0; }
    .tt { fill:#e2e5ef; }
    .dim{ fill:#7d8296; }
    .d  { font-family:Arial,Helvetica,sans-serif; font-weight:700; fill:#e2e5ef; letter-spacing:2px; }
    .ln { stroke:#9ba0b4; fill:none; }
    .lnd{ stroke:#565b6e; fill:none; }
  </style>

  <rect x="0" y="0" width="830" height="270" fill="#1f212b"/>

  <!-- header strip -->
  <line x1="8" y1="10" x2="822" y2="10" class="ln"/>
  <text x="8" y="28" class="tt" font-size="10" letter-spacing="2">[ ABOUT // DATACLUSTER ]</text>
  <text x="822" y="28" text-anchor="end" class="dim" font-size="7.5">INDEX :: 01/04</text>

  <!-- A: ROLE -->
  <g>
    <rect x="8" y="38" width="360" height="220" fill="#242735" stroke="#3a3e4e"/>
    <text x="16" y="62" class="d" font-size="12">DATACLUSTER</text>
    <text x="360" y="62" text-anchor="end" class="dim" font-size="7">INTERFACE :: RESET // 04</text>
    <line x1="16" y1="70" x2="360" y2="70" class="lnd"/>
    <text x="16" y="94" class="t" font-size="8">ROLE      :: AI SOFTWARE ENGINEER</text>
    <text x="16" y="110" class="t" font-size="8">TEAM      :: AI TIGER TEAM — ENTERPRISE AI</text>
    <text x="16" y="126" class="t" font-size="8">EMPLOYER  :: DEPT OF ENERGY</text>
    <text x="16" y="142" class="t" font-size="8">FOCUS     :: RAG // PIPELINES // LLM R&amp;D</text>
    <text x="16" y="158" class="t" font-size="8">INTEGRATE :: ENTERPRISE ENVIRONMENTS</text>
    <text x="16" y="174" class="t" font-size="8">PREV      :: FINTECH BI + AUTOMATION</text>
    <rect x="16" y="190" width="90" height="16" fill="url(#bc)"/>
    <text x="118" y="202" class="dim" font-size="7">SIG-BLOCK // 0864</text>
    <rect x="16" y="218" width="70" height="26" fill="url(#dg2)"/>
    <text x="98" y="230" class="dim" font-size="7">方式 — SYSTEM // METHOD</text>
    <text x="98" y="242" class="dim" font-size="7">ENTRY :: NODE-ACTIVE // 022</text>
    <text x="360" y="250" text-anchor="end" class="dim" font-size="7">A-01</text>
  </g>

  <!-- B: LEARNING QUEUE -->
  <g>
    <rect x="374" y="38" width="230" height="220" fill="#242735" stroke="#3a3e4e"/>
    <text x="382" y="62" class="tt" font-size="10" letter-spacing="2">LEARNING_QUEUE</text>
    <text x="596" y="56" text-anchor="end" class="dim" font-size="7">B-02</text>
    <line x1="382" y1="70" x2="596" y2="70" class="lnd"/>
    <rect x="382" y="85" width="6" height="6" class="ln"/>
    <line x1="382" y1="91" x2="388" y2="85" class="tt"/>
    <text x="394" y="92" class="t" font-size="8">GRAPH ENGINEERING — AGENTS</text>
    <rect x="382" y="103" width="6" height="6" class="ln"/>
    <text x="394" y="110" class="t" font-size="8">LLM ARCHITECTURE</text>
    <rect x="382" y="121" width="6" height="6" class="lnd"/>
    <text x="394" y="128" class="t" font-size="8">MODEL TRAINING — AT SCALE</text>
    <rect x="382" y="139" width="6" height="6" class="lnd"/>
    <text x="394" y="146" class="t" font-size="8">ENTERPRISE LLM INTEGRATION</text>
    <text x="596" y="126" text-anchor="end" class="dim" font-size="14">学習</text>
    <text x="382" y="178" class="dim" font-size="7">QUEUE :: 04 — STATUS :: PROCESSING</text>
    <rect x="382" y="186" width="206" height="5" class="lnd"/>
    <rect x="382" y="186" width="82" height="5" fill="#a7abc0" opacity="0.5"/>
    <text x="588" y="196" text-anchor="end" class="dim" font-size="7">40%</text>
    <rect x="382" y="212" width="50" height="32" fill="url(#dg2)" opacity="0.7"/>
    <text x="444" y="224" class="dim" font-size="7">DECODE :: 11-11-33A</text>
    <text x="444" y="236" class="dim" font-size="7">PACKET :: B-02 // MODULE-4</text>
  </g>

  <!-- C: SERVICE RECORD -->
  <g>
    <rect x="610" y="38" width="212" height="220" fill="#262a3a" stroke="#3a3e4e"/>
    <text x="618" y="62" class="d" font-size="11">SERVICE_RECORD</text>
    <text x="814" y="56" text-anchor="end" class="dim" font-size="7">C-03</text>
    <line x1="618" y1="70" x2="814" y2="70" class="lnd"/>
    <text x="618" y="98" class="d" font-size="22">2008 —</text>
    <text x="618" y="120" class="t" font-size="8">U.S. ARMY — ACTIVE</text>
    <text x="618" y="136" class="t" font-size="8">CIVIL AFFAIRS TEAM SERGEANT</text>
    <text x="618" y="152" class="t" font-size="8">PACIFIC THEATER // OCONUS</text>
    <g>
      <rect x="618" y="164" width="9" height="6" class="lnd"/>
      <rect x="630" y="160" width="9" height="10" class="lnd"/>
      <rect x="642" y="156" width="9" height="14" class="lnd"/>
      <rect x="654" y="152" width="9" height="18" class="ln"/>
      <rect x="666" y="148" width="9" height="22" class="ln"/>
    </g>
    <text x="618" y="202" class="dim" font-size="6.5">RANK PROGRESSION // ACTIVE-DUTY</text>
    <text x="796" y="240" text-anchor="end" class="dim" font-size="20">任務</text>
    <text x="618" y="232" class="dim" font-size="7">CHANNEL :: 01 — ACTIVE</text>
    <text x="618" y="246" class="dim" font-size="7">PWR :: 88 // TEMP :: 02°C</text>
  </g>
</svg>