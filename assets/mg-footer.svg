<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 92" font-family="'Courier New',Courier,monospace">
  <style>
    .t  { fill:#a7abc0; }
    .tt { fill:#e2e5ef; }
    .dim{ fill:#7d8296; }
    .d  { font-family:Arial,Helvetica,sans-serif; font-weight:700; fill:#e2e5ef; letter-spacing:2px; }
    .ln { stroke:#9ba0b4; fill:none; }
    .lnd{ stroke:#565b6e; fill:none; }
  </style>

  <rect x="0" y="0" width="830" height="92" fill="#1f212b"/>

  <line x1="8" y1="8" x2="822" y2="8" class="ln"/>
  <text x="8" y="28" class="tt" font-size="9" letter-spacing="1">STATUS :: OPERATIONAL</text>
  <text x="415" y="28" text-anchor="middle" class="dim" font-size="7.5" letter-spacing="1">UPTIME :: CONTINUOUS</text>
  <text x="822" y="28" text-anchor="end" class="t" font-size="7.5" letter-spacing="1">ACCESS :: GRANTED</text>

  <text x="8" y="48" class="dim" font-size="7">SYS :: 873 // BATTERY 83 // TEMP 27°C — WCL 24</text>
  <text x="8" y="62" class="dim" font-size="7">TARGET :: SUBSYSTEM-09 — UNIT-0556 // 262.01 — LOG :: 92%</text>
  <text x="300" y="56" class="dim" font-size="18">通信</text>

  <g class="lnd">
    <path d="M370 44 h30 M406 44 h18 M430 44 h12 M448 44 h24 M478 44 h10 M494 44 h14"/>
  </g>
  <circle cx="512" cy="44" r="2.5" class="tt">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <text x="822" y="82" text-anchor="end" class="d" font-size="11">EOF // 0864</text>
  <text x="8" y="82" class="dim" font-size="7">LOG-472 // CHANNEL-01 // PACKETS-COMPLETE :: 0864</text>
  <line x1="8" y1="88" x2="822" y2="88" class="lnd" stroke-dasharray="2 4"/>
</svg>